{{ define "main" }}
<h1 class="section-title">{{ .Title }}</h1>

<label class="sr-only" for="search-input">{{ .Params.placeholder | default "Search..." }}</label>
<input type="text" id="search-input" class="search-input" placeholder="{{ .Params.placeholder | default "Search..." }}" autocomplete="off" role="searchbox" aria-label="{{ .Params.placeholder | default "Search..." }}">
<p class="search-status" id="search-status" role="status" aria-live="polite"></p>
<ul class="post-list" id="search-results"></ul>

<script>
(function() {
  var searchInput = document.getElementById('search-input');
  var results = document.getElementById('search-results');
  var status = document.getElementById('search-status');
  var data = [];
  var timer = null;
  var isBn = document.documentElement.lang === 'bn';

  fetch('{{ "index.json" | relURL }}')
    .then(function(r) { return r.json(); })
    .then(function(d) { data = d; })
    .catch(function() {
      status.textContent = isBn ? 'সূচি লোড করা যায়নি।' : 'Could not load the search index.';
    });

  function render(matches, q) {
    results.innerHTML = '';
    if (!q) {
      status.textContent = '';
      return;
    }
    if (!matches.length) {
      status.textContent = isBn ? 'কিছু পাওয়া যায়নি।' : 'No results found.';
      return;
    }
    status.textContent = isBn
      ? matches.length + 'টি ফলাফল।'
      : matches.length + (matches.length === 1 ? ' result.' : ' results.');
    matches.slice(0, 20).forEach(function(item) {
      var li = document.createElement('li');
      li.className = 'post-entry';
      var a = document.createElement('a');
      a.href = item.permalink;
      var title = document.createElement('div');
      title.className = 'post-entry-title';
      title.textContent = item.title || '';
      a.appendChild(title);
      if (item.summary) {
        var summary = document.createElement('div');
        summary.className = 'post-entry-summary';
        summary.textContent = item.summary;
        a.appendChild(summary);
      }
      li.appendChild(a);
      results.appendChild(li);
    });
  }

  searchInput.addEventListener('input', function() {
    clearTimeout(timer);
    var el = this;
    timer = setTimeout(function() {
      var q = el.value.toLowerCase().trim();
      if (!q) { render([], ''); return; }
      var matches = data.filter(function(item) {
        return (item.title && item.title.toLowerCase().includes(q)) ||
               (item.summary && item.summary.toLowerCase().includes(q)) ||
               (item.content && item.content.toLowerCase().includes(q)) ||
               (item.tags && item.tags.some(function(t) { return t.toLowerCase().includes(q); }));
      });
      render(matches, q);
    }, 200);
  });
})();
</script>
{{ end }}
